<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaggleCracker — {{ settings.competition or "no competition" }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<script>
  // Before first paint so the dark theme never flashes light.
  if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
</script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">K</div>
    <div>
      <h1>KaggleCracker</h1>
      <p>{{ settings.competition or "no competition set" }}</p>
    </div>
  </div>
  <div class="spacer"></div>
  {% block headline %}{% endblock %}
  <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
    <svg id="themeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
{% block body %}{% endblock %}
<script>
  const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>';
  const themeIcon = document.getElementById("themeIcon");
  const setIcon = () => {
    themeIcon.innerHTML = document.documentElement.classList.contains("dark") ? MOON : SUN;
  };
  setIcon();
  document.getElementById("themeBtn").addEventListener("click", () => {
    const dark = document.documentElement.classList.toggle("dark");
    localStorage.setItem("theme", dark ? "dark" : "light");
    setIcon();
  });
</script>
</body>
</html>
