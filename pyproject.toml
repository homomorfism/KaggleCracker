[project]
name = "kagglecracker"
version = "0.1.0"
description = "Agent that runs ML experiments and submits to Kaggle behind a human approval gate"
requires-python = ">=3.13,<3.14"
# The original assignment ran stdlib-only; the workbench features (FastAPI API,
# Kaggle downloads, EDA subprocesses) relaxed that rule. core/ still imports
# nothing outside the stdlib.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "kaggle>=1.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false
