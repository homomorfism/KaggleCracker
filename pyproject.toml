[project]
name = "kagglecracker"
version = "0.1.0"
description = "Autonomous Kaggle tabular competition agent: AIDE-style tree search over sandboxed ML solutions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.60",
    "anthropic>=0.42",
    "pandas>=2.2",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "typer>=0.15",
    "kaggle>=2.2.0",
]

[project.scripts]
kagglecracker = "kagglecracker.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kagglecracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `eval` fires real LLM calls and costs tokens; `live` needs a running Docker
# daemon and the built sandbox image. Both are excluded from the default run so
# the suite stays fast and dependency-free; opt in with `pytest -m eval` /
# `pytest -m live`.
addopts = "-m 'not eval and not live'"
markers = [
    "eval: live LLM call, costs tokens, opt-in only",
    "live: touches the real Kaggle API, opt-in only",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
